{t:"Step 2. Zones and takt",pts:["Takt planning divides the building into zones of similar work content (here: building and level).","Each trade works one zone, then moves to the next at a steady rhythm (the takt time). Small, equal batches keep the flow smooth.","Big, uneven zones create queues: one trade finishes far ahead of the next and work-in-progress piles up."],q:"What is the main purpose of takt planning?",o:["A steady, repeatable flow of trades through zones","Finishing every activity as early as possible","Giving each trade the longest possible duration","Starting all zones at the same time"],a:0,why:"Takt is about rhythm and flow, not speed on one activity. A steady rhythm makes problems visible early."},
{t:"Step 3. Flow, trade train and buffers",pts:["Order the trades as a train: each trade follows the one before it through the zones, with a small lag so they do not work on top of each other.","A crew should work continuously: gaps between zones are paid idle time and lost learning.","Variability is normal. Protect the train with a few explicit buffers (a time buffer before handover) instead of padding every task."],q:"Why does the planner keep each crew working continuously from zone to zone?",o:["Idle crews waste paid time and break the flow","It makes the schedule look shorter on paper","It lets every trade start on day one","It removes the need for supervisors"],a:0,why:"Continuity keeps crews productive and makes the flow predictable for the trades that follow."},
{t:"Step 4. Pull planning",pts:["Pull planning starts from the milestone (handover) and works backwards: each trade states what it needs, and when, from the trade before it.","Work starts only when the next trade needs it, not as early as possible. Early starts create inventory and work-in-progress.","The project buffer sits at the end, so delay in one trade is absorbed there rather than silently moving the handover."],q:"Pull planning is built by working...",o:["Backwards from the target date, based on what the next trade needs","Forwards from today, starting everything at once","Only from the contract programme, never from the trades","From the cheapest activity to the most expensive"],a:0,why:"Pull means the customer (the next trade, and finally the client) sets the timing."},
{t:"Step 5. Make-ready (6-week lookahead)",pts:["Within the next six weeks, check every activity for constraints: drawings, materials, labour, equipment, space and prerequisite work.","Only release work that is sound, meaning every constraint is cleared. Releasing unready work just creates waiting and rework.","Constraints that cannot be cleared in time are raised now with the main contractor or production, while there is still time to act."],q:"An activity starts in 3 weeks but its shop drawings are not approved. What should the planner do?",o:["Keep it unreleased and chase the approval now","Release it anyway and hope the drawings arrive","Delete the activity from the schedule","Move it to the end of the project without telling anyone"],a:0,why:"Make-ready means removing the constraint before the work is released to the weekly plan."},
{t:"Step 6. Weekly work plan and PPC",pts:["Each week the team commits only to released work it is sure it can finish.","At the end of the week record what was done. PPC (Percent Plan Complete) = tasks done as promised / tasks committed.","Always record why a task was missed. The reasons show the real problems; a PPC of 80% or more shows a reliable plan."],q:"Seven of ten committed tasks were finished this week. What is the PPC?",o:["70%","30%","7%","100%"],a:0,why:"PPC = 7 / 10 = 70%. Track the reasons for the other three, that is where the learning is."}];

async function tick(){if(!stm)return;const v=document.getElementById("scv");if(v.videoWidth){let d="";try{if(window.BarcodeDetector){const r=await new BarcodeDetector({formats:["qr_code"]}).detect(v);if(r[0])d=r[0].rawValue}else if(window.jsQR){const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d");x.drawImage(v,0,0);const i=x.getImageData(0,0,c.width,c.height),r=jsQR(i.data,c.width,c.height);if(r)d=r.data}}catch(x){}if(d)hit(d)}setTimeout(tick,250)}
function hit(raw){const id=String(raw.split("|")[1]||raw).trim().toUpperCase(),t=Date.now(),m=document.getElementById("scm");if(!id||(id==lastHit&&t-lastAt<3000))return;lastHit=id;lastAt=t;
const emp=(S.emps||[]).find(x=>String(x.id).toUpperCase()==id);if(!emp){m.textContent="Unknown ID: "+id;return}
const l=g(scT),tm=new Date().toTimeString().slice(0,5);S.att=S.att||[];{const why=safeBlock(l);if(why){m.textContent=why;return}}
if(S.att.some(a=>a.t==scT&&a.d==T&&a.id==emp.id&&!a.out)){m.textContent=emp.name+" is already checked in";return}
S.att.push({d:T,t:scT,id:emp.id,name:emp.name,in:tm,out:""});if(/leader|foreman|supervisor/i.test(emp.role||"")&&l&&emp.team)l.team=emp.team;m.textContent="✓ "+emp.name+" ("+emp.id+") checked in "+tm;save()}
function closeScan(){if(stm){stm.getTracks().forEach(t=>t.stop());stm=null}document.getElementById("scan").style.display="none";R()}
function addEmp(){const v=i=>document.getElementById(i).value.trim();if(!v("en")||!v("ei"))return;if((S.emps||[]).some(x=>String(x.id).toUpperCase()==v("ei").toUpperCase()))return alert("That ID already exists");(S.emps=S.emps||[]).push({id:v("ei"),name:v("en"),role:v("er"),team:v("et"),site:v("es")});R()}
function delEmp(i){S.emps.splice(i,1);R()}
function fin(id){const l=g(id),q=+document.getElementById("q"+id).value,h=+document.getElementById("h"+id).value;if(!(q>0))return;if((l.ac||0)+q>l.qty+0.05){const m="Rejected: "+q+" m² would bring the cumulative quantity to "+r1((l.ac||0)+q)+", above the BOQ quantity of "+l.qty+" "+l.uom+". Maximum allowed today: "+r1(Math.max(0,l.qty-(l.ac||0)))+".";lg(l,"Quantity entry rejected",m);alert(m);return}const P=(S.att||[]).filter(a=>a.t==id&&a.d==T&&!a.out),w=P.length||l.w||4;P.forEach(a=>a.out=new Date().toTimeString().slice(0,5));S.logs.push({d:T,team:l.team||S.teams[0],t:id,w,h,q,s:l.t0,f:new Date().toTimeString().slice(0,5)});l.ac=(l.ac||0)+q;l.done=r1(Math.min(100,l.ac/l.qty*100));l.t0="";lg(l,"Work logged",q+" m2 by "+w+" workers");
if(l.done>=100){l.st="comp";mkWir(l)}R()}
async function obs(){const v=i=>document.getElementById(i).value,ph=await photosFrom("op");S.obs.push({d:T,t:+v("ot"),ty:v("oy"),h:+v("oh")||0,n:v("on"),ph});const l=g(+v("ot"));if(l)lg(l,"Obstruction recorded",v("oy")+", "+(+v("oh")||0)+" h"+(ph.length?", "+ph.length+" photo(s)":""));R()}
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
