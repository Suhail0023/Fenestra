function handoverCard(){const h=handoverData();return`<div class="c"><h3>Handover pack</h3><div class="m">Approved WIRs with dates, measured values and photos, plus closed snags. Handover is held until every WIR is approved and every snag is closed.</div><div class="${h.ready?"t o":"t a"}" style="display:block;margin:6px 0">${h.ready?"Ready for handover":"Handover hold: "+h.pend+" WIR(s) not approved, "+h.open+" snag(s) open"}</div><div class="f"><button class="p" ${h.ready?"":"disabled"} onclick="handoverOut('html')">Download pack (open it, then Print or Save as PDF)</button><button ${S.insp.length?"":"disabled"} onclick="handoverOut('xlsx')">Download Excel</button></div></div>`}
function handoverOut(kind){const A=S.insp.filter(x=>x.s=="Approved");if(kind=="xlsx"){const rows=[["WIR","Task","BOQ line","Quantity m2","Requested","Approved on","Approved by","Check","Result","Value"]];A.forEach(x=>{const r=rootOf(x.tid),tp=x.c||[];tp.forEach((c,j)=>{const [rs,v]=String((x.cr||[])[j]||"").split(":");rows.push([x.no,x.n,r?r.name:"",x.qty,x.d,x.dd,x.by,c,rs=="P"?"Pass":rs=="F"?"Fail":rs=="NA"?"N/A":"",v||""])})});xlsxOut(rows,"Handover_"+PC+"_"+T+".xlsx","WIR");return}
const body=`<h1>Handover pack - ${e(PC)} ${e(S.proj.name||"")}</h1><p>Generated ${T}</p>`+A.map(x=>{const r=rootOf(x.tid);return`<h3>${e(x.no)} - ${e(x.n)}</h3><p>BOQ line: ${e(r?r.name:"")} · quantity ${x.qty} m² · requested ${x.d} · approved ${x.dd} by ${e(x.by)}</p>`+(x.c||[]).map((c,j)=>{const [rs,v]=String((x.cr||[])[j]||"").split(":");return`<div>${rs=="P"?"✔":rs=="F"?"✘":rs=="NA"?"–":"·"} ${e(c)}${v?" = "+e(v):""}</div>`}).join("")+(x.ph&&x.ph.length?x.ph.map(u=>`<img src="${e(fU(u))}" style="height:90px">`).join(""):"")}).join("")+`<h2>Closed snags</h2>`+S.snags.filter(s=>s.s=="closed").map(s=>`<div>${e(s.no)} ${e(s.loc||"")}: ${e(s.desc||"")} (closed ${s.dc||""})</div>`).join("");
htmlOut(body,"Handover_"+PC+"_"+T+".html")}
const htmlDoc=b=>`<!doctype html><meta charset="utf-8"><title>Report</title><style>body{font:14px/1.45 Segoe UI,Arial,sans-serif;margin:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:4px 6px;text-align:left}img{margin:2px;border-radius:3px}h1{font-size:20px}h2{font-size:16px;margin-top:18px}h3{font-size:14px}@media print{button{display:none}}</style><button onclick="print()">Print / Save as PDF</button>${b}`;
function htmlOut(b,name){const bl=new Blob([htmlDoc(b)],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500)}
function xlsxOut(rows,name,sheet,more){if(typeof XLSX=="undefined"){alert("The Excel writer did not load. Check the internet connection.");return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),sheet||"Sheet1");(more||[]).forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));XLSX.writeFile(wb,name)}

else{p.s=op=="ap"?"Approved":op=="rej"?"Rejected":"Closed";p.ap=role;S.ev.push({d:T,tm:nowT(),id:p.tid,n:l?l.name:"",ev:"Permit "+p.no+" "+p.s.toLowerCase(),by:role,note:"",u:USER?USER.name:role});notify("Permit "+p.no+" "+p.s.toLowerCase(),l?l.name:"")}R()}

${S.ptw.map((p,i)=>`<div class="c"><b>${e(p.no)}</b> <span class="t ${p.s=="Approved"?"o":p.s=="Requested"?"a":"r"}">${p.s}</span> ${e(p.type)} · ${e(g(p.tid)?.name||"")} <span class="m">valid ${p.vf} to ${p.vt} · requested ${p.d} by ${e(p.by)}${p.ap?" · decided by "+e(p.ap):""}</span>${p.note?`<div class="m">${e(p.note)}</div>`:""}${p.s=="Requested"&&canAp?`<div class="f"><button class="p" onclick="ptwAct('ap',${i})">Approve</button><button onclick="ptwAct('rej',${i})">Reject</button></div>`:""}${p.s=="Approved"&&canAp?`<button onclick="ptwAct('cl',${i})">Close permit</button>`:""}</div>`).join("")||"<p class=m>No permits yet.</p>"}</div>

function autoLinks(){const L=leaves().filter(l=>l.start),out=[],seq=L.filter(l=>!/glass|shutter/i.test(l.name)),suf=l=>l.name.split(" / ").slice(1).join(" / ");
for(let i=1;i<seq.length;i++)out.push({a:seq[i-1].id,b:seq[i].id,ty:"SS",lag:Math.min(seq[i-1].dur,15),auto:1});
L.filter(l=>/glass|shutter/i.test(l.name)).forEach(l=>{const p=L.find(x=>x.id!=l.id&&suf(x)==suf(l)&&!/glass|shutter/i.test(x.name)&&/frame|bracket|outer|channel|rail/i.test(x.name));if(p)out.push({a:p.id,b:l.id,ty:"SS",lag:15,auto:1})});return out}
function cpm(){const L=leaves().filter(l=>l.start),ID={};L.forEach(l=>ID[l.id]=l);const E=[...autoLinks(),...S.xl.map(x=>({...x}))].filter(x=>ID[x.a]&&ID[x.b]),fin=L.reduce((m,l)=>end(l)>m?end(l):m,T),D=d=>diff("2000-01-01",d),LS={},succ={};
E.forEach(x=>(succ[x.a]=succ[x.a]||[]).push(x));
const ls=l=>{if(LS[l.id]!==undefined)return LS[l.id];LS[l.id]=D(l.start);let v=D(fin)-l.dur+1;(succ[l.id]||[]).forEach(x=>{const s=ID[x.b],lsb=ls(s);v=Math.min(v,x.ty=="FS"?lsb-(x.lag||0)-l.dur:lsb-(x.lag||0))});LS[l.id]=v;return v};
return L.map(l=>{const f=ls(l)-D(l.start);return{l,float:Math.max(0,Math.round(f)),crit:f<=0}})}
function freezeBase(){if(!isPL())return;if(S.base&&!confirm("A baseline from "+S.base.d+" exists. Replace it?"))return;if(S.base){(S.baseH=S.baseH||[]).push(S.base)}const t={};leaves().forEach(l=>{if(l.start)t[l.id]={s:l.start,e:end(l)}});S.base={d:T,by:role,t};S.ev.push({d:T,tm:nowT(),id:0,n:"Baseline",ev:"Baseline frozen",by:role,note:Object.keys(t).length+" activities",u:USER?USER.name:role});notify("Baseline frozen",Object.keys(t).length+" activities");R()}

function insights(){const stat=(fn)=>{const L=S.logs.filter(fn);const q=L.reduce((a,l)=>a+l.q,0),mh=L.reduce((a,l)=>a+l.w*l.h,0);return{n:L.length,q,mh,v:q?mh/q:0}};

function isoD(v){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.toISOString().slice(0,10)}const s=String(v||"").trim();if(!s)return"";if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const t=Date.parse(s.replace(/\*$/,""));return isNaN(t)?"":new Date(t+12*3600e3).toISOString().slice(0,10)}

 L.innerHTML=`${loginHead()}<h2>Request an account</h2>${f("su_n","Full name")}${f("su_u","User name","","3 to 30 letters or numbers")}${f("su_e","Email","email")}${f("su_p","Phone")}<label>Role<br><select id="su_r" style="width:100%">${SU_ROLES.map(r=>`<option>${r}`).join("")}</select></label>${f("su_w","Password","password","8 or more characters")}<p class="t ${ok?"g":"r"}" style="display:${msg?"block":"none"}">${e(msg||"")}</p><button class="p" onclick="suGo()">Send request</button> <button onclick="showLogin()">Back to login</button><div class="m">Management reviews each request and confirms your role before you can log in.</div>`}
async function suGo(){const v=i=>document.getElementById(i).value.trim();try{const r=await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:v("su_n"),u:v("su_u"),email:v("su_e"),phone:v("su_p"),role:document.getElementById("su_r").value,password:document.getElementById("su_w").value})}),j=await r.json();if(!r.ok){suShow(j.error||"Failed");return}showLogin("Request sent. You can log in once Management approves it.",true)}catch(x){suShow("Cannot reach the server")}}
function loginHead(){return `<div style="text-align:center;margin-bottom:8px">${CO.logo?`<img src="${e(CO.logo)}" style="height:56px;max-width:180px;object-fit:contain"><br>`:""}<b>${e(CO.name||"Fenestra Site")}</b></div>`}

/* ---- project tree: projects can hold sub-projects, buildings, scopes, phases, zones ---- */
const KINDS=["Project","Sub-project","Building","Scope / package","Phase","Zone"];
let PCOL=[];try{PCOL=JSON.parse(localStorage.getItem("fx-pcol")||"[]")}catch(x){}
function plTree(){const by={},ok=c=>PL.some(x=>x.code==c);PL.forEach(p=>{const k=p.parent&&p.parent!=p.code&&ok(p.parent)?p.parent:"";(by[k]=by[k]||[]).push(p)});
 const out=[],seen=new Set(),walk=(k,d,pa)=>(by[k]||[]).forEach(p=>{if(seen.has(p.code))return;seen.add(p.code);out.push({p,d,kids:(by[p.code]||[]).length,anc:pa});walk(p.code,d+1,pa.concat(p.code))});walk("",0,[]);
 PL.forEach(p=>{if(!seen.has(p.code))out.push({p,d:0,kids:0,anc:[]})});return out}
function plDesc(c){const r=new Set(),w=k=>PL.filter(x=>x.parent==k).forEach(x=>{if(!r.has(x.code)){r.add(x.code);w(x.code)}});w(c);return r}

 if(typeof code!="string"){view="port";R();return}

 name=(name||"").trim()||code;parent=parent||"";kind=KINDS.includes(kind)?kind:(parent?"Sub-project":"Project");
 const b=blankProj(code,name),cp=o=>JSON.parse(JSON.stringify(o));
 b.emps=cp(S.emps||[]);b.rates=cp(S.rates);b.chkItems=[...(S.chkItems||CHK)];b.wirTpl=cp(S.wirTpl||defTpl());b.fin=Object.assign({},S.fin);b.contacts=cp(S.contacts||{});
 if(API){const r=await api("/api/project",{method:"POST",body:JSON.stringify({code,name,state:b,parent,kind})});if(!r.ok){alert((await r.json()).error||"Could not create the project");return}PL=await r.json()}
 else{PL.push({code,name,parent,kind});try{localStorage.setItem("fx-projs",JSON.stringify(PL));localStorage.setItem(KEY+"-"+code,JSON.stringify(b))}catch(x){}}
 portAt=0;await switchProj(code);view="port";R()};

{t:"Step 4. Pull planning",pts:["Pull planning starts from the milestone (handover) and works backwards: each trade states what it needs, and when, from the trade before it.","Work starts only when the next trade needs it, not as early as possible. Early starts create inventory and work-in-progress.","The project buffer sits at the end, so delay in one trade is absorbed there rather than silently moving the handover."],q:"Pull planning is built by working...",o:["Backwards from the target date, based on what the next trade needs","Forwards from today, starting everything at once","Only from the contract programme, never from the trades","From the cheapest activity to the most expensive"],a:0,why:"Pull means the customer (the next trade, and finally the client) sets the timing."},

/* ---------- 3. forecast, operational budget and alert ---------- */
function fcData(){
  const I=insights(),act={};I.rows.forEach(x=>{if(x.s.n>=3&&x.s.v>0)act[x.r.k]=x.s.v});
  const base=mhAct();let rem=0,remStd=0;const L=[];
  leaves().forEach(l=>{
    const rq=l.st=="comp"?0:(l.qty>0?remQ(l):0),rw=rowFor(l),std=rw.z*refH()/rw.q,used=act[rw.k]||std,eff=Math.min(1.5,Math.max(.5,std/used));
    rem+=rq*used;remStd+=rq*std;
    if(!(rq>0)||!l.start)return;
    const b=brief(l),days=Math.max(1,Math.ceil(rq/(b.tm*rw.q*pFac()*eff))),s0=l.start>T?l.start:T,fin=add(s0,days-1);
    L.push({l,w:b.w,sp:b.sp,lg:b.lg,st:b.st,s0,fin,plan:end(l),eff,rq})});
  const eac=base+rem,day={};let last=T,peak=0,peakD=T;
  L.forEach(x=>{if(x.fin>last)last=x.fin;for(let d=x.s0,n=0;d<=x.fin&&n<400;d=add(d,1),n++){if(isHol(d))continue;const o=day[d]||(day[d]={w:0,sp:0,lg:0,st:0});o.w+=x.w;o.sp+=x.sp;o.lg+=x.lg;o.st+=x.st}});
  Object.entries(day).forEach(([d,o])=>{if(o.w>peak){peak=o.w;peakD=d}});
  const weeks=[],w0=mondayOf(T);
  for(let i=0;i<12;i++){const a=add(w0,i*7);let pk=0,ds=0,sum=0,sp=0,lg=0,st=0,mh=0;
    for(let k=0;k<7;k++){const o=day[add(a,k)];if(o){pk=Math.max(pk,o.w);sum+=o.w;ds++;sp=Math.max(sp,o.sp);lg=Math.max(lg,o.lg);st=Math.max(st,o.st);mh+=o.w*prodH()}}
    if(!ds&&i>0&&!weeks.some(x=>x.ds))break;weeks.push({a,pk,avg:ds?Math.round(sum/ds):0,ds,sp,lg,st,mh:Math.round(mh)})}
  while(weeks.length&&!weeks[weeks.length-1].ds)weeks.pop();
