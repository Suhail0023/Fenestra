<style>
:root{--bg:#edf1f3;--pn:#fff;--tx:#14242c;--mu:#5a6e78;--ln:#d2dce1;--ac:#0b7a75;--am:#d99a00;--bad:#c23b2e;--ok:#2c8a4b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171b;--pn:#17222a;--tx:#e5edf0;--mu:#92a5ae;--ln:#2a3a43;--ac:#3cc4bb;--am:#f0b92b;--bad:#ef6a5b;--ok:#5cc47d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f171b;--pn:#17222a;--tx:#e5edf0;--mu:#92a5ae;--ln:#2a3a43;--ac:#3cc4bb;--am:#f0b92b;--bad:#ef6a5b;--ok:#5cc47d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pn);z-index:10}
#mods{flex:1 0 100%;display:flex;gap:4px;order:99;overflow-x:auto;margin:2px -14px -8px;padding:0 14px;border-top:1px solid var(--ln)}#mods button{border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}#mods button.on{border-bottom-color:var(--ac,#0a84ff)}#mods button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:2px;justify-content:center;overflow-x:auto;background:var(--pn);border-top:1px solid var(--ln);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}#foot button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:68px;border:0;background:none;color:inherit;font:inherit;font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}#foot button span{font-size:18px;line-height:1.1}#foot button.on{background:var(--ac);color:#fff}#foot button{position:relative}#foot b{position:absolute;top:0;right:8px;background:var(--am);color:#000;border-radius:9px;padding:0 6px;font-size:11px}body{padding-bottom:58px}nav{max-height:calc(100vh - var(--hh,52px) - 58px)!important}@media print{#foot{display:none}body{padding-bottom:0}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pn);border-bottom:1px solid var(--ln);padding:8px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.2px}h2{font-size:16px;margin:18px 0 8px}h3{font-size:14px;margin:0 0 6px}
#wrap{display:flex;align-items:flex-start}#wrap>main{flex:1;min-width:0;margin:0}nav{display:flex;flex-direction:column;gap:2px;width:196px;flex:none;position:sticky;top:var(--hh,52px);max-height:calc(100vh - var(--hh,52px));overflow-y:auto;padding:8px 6px;border-inline-end:1px solid var(--ln);background:var(--pn)}#mnu{display:none;border:0;background:none;font-size:22px;cursor:pointer;color:var(--tx,inherit)}[data-dv=mob] #mnu{display:inline-block}[data-dv=mob] nav{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:40;width:230px;max-height:none;padding-top:56px;transform:translateX(calc(-105% * var(--d,1)));transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.3)}[data-dv=mob] nav.open{transform:none}[dir=rtl]{--d:-1}[data-dv=tab] nav{width:158px}[data-dv=tab] main{padding:10px}[data-dv=mob] main{padding:8px}[data-dv=mob] .c{overflow-x:auto}[data-dv=mob] input,[data-dv=mob] select,[data-dv=mob] button,[data-dv=tab] button,[data-dv=tab] select{min-height:38px}[data-dv=mob] .g{grid-template-columns:1fr}[data-dv=mob] header{padding:6px 8px;gap:6px}[data-dv=mob] h1{font-size:16px}[data-dv=mob] #lang,[data-dv=mob] #role,[data-dv=mob] #prj{max-width:130px}#vmb{border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer}@media print{nav{display:none!important}}nav button{text-align:start;white-space:nowrap;border:0;background:none;color:var(--mu);padding:7px 11px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}nav b{background:var(--am);color:#000;border-radius:9px;padding:0 6px;font-size:12px;margin-left:5px}
main{padding:14px;max-width:1180px;margin:auto}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.k{font-size:30px;font-weight:700}.m{color:var(--mu);font-size:13px}
button,select,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:5px 9px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--am);outline-offset:1px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.t{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;background:var(--ln)}.t.a{background:var(--am);color:#000}.t.o{background:var(--ok);color:#fff}.t.r{background:var(--bad);color:#fff}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.gt{display:flex}.gl{flex:0 0 190px}.gr{overflow-x:auto;flex:1;position:relative}.row{height:26px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;border-bottom:1px solid var(--ln)}
#prt{display:none}@media print{body.printing>*:not(#prt){display:none!important}body.printing #prt{display:block!important;padding:12px}body.printing{background:#fff;color:#000}}
.tr{position:relative;height:26px;border-bottom:1px solid var(--ln)}.tr i{position:absolute;top:6px;height:14px;border-radius:3px;background:var(--ac)}.tr i.d{background:var(--ok)}.tr i.n{background:var(--mu)}
.td{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.ch{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}.ch div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.ch span{display:inline-block;width:42%;background:var(--ac);vertical-align:bottom;min-height:2px}.ch span+span{background:var(--am)}
.ind{padding-left:calc(var(--l)*18px)}label{display:block;margin:3px 0}.f{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.f label{margin:0}
@media print{header,.np{display:none!important}main{padding:0}}
nav .ng{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:12px 10px 4px}nav .ng:first-child{padding-top:4px}nav .ni{display:inline-block;width:22px}nav button{display:flex;align-items:center;width:100%;border-radius:8px}nav button:hover:not(.on){background:var(--bg)}nav button b{margin-inline-start:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 12px;padding:2px 2px 10px;border-bottom:1px solid var(--ln)}.ph h2{margin:0;font-size:20px}.ph p{margin:2px 0 0;color:var(--mu);font-size:13px;max-width:70ch}
.c{box-shadow:0 1px 2px rgba(0,0,0,.04)}button:hover:not(:disabled){filter:brightness(.96)}button.p:hover:not(:disabled){filter:brightness(1.1)}th{position:sticky;top:0;background:var(--pn);font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}tbody tr:hover td,tr:hover>td{background:rgba(11,122,117,.05)}input,select{min-height:32px}input:disabled,select:disabled{opacity:.6}
#hlp{position:fixed;top:0;bottom:0;inset-inline-end:0;width:390px;max-width:100vw;background:var(--pn);border-inline-start:1px solid var(--ln);box-shadow:-6px 0 24px rgba(0,0,0,.25);z-index:60;display:flex;flex-direction:column}#hlp .hh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:16px}#hlp .ht{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--ln)}#hlp .ht button{border:0;background:none;color:var(--mu);border-radius:6px}#hlp .ht button.on{background:var(--ac);color:#fff}#hlp .hm{flex:1;overflow:auto;padding:12px 14px}#hlp .hf{padding:6px 14px;border-top:1px solid var(--ln)}#hlp h4{margin:12px 0 4px}#hlp .tp{margin:6px 0}.bb{max-width:92%;margin:6px 0;padding:8px 11px;border-radius:12px;background:var(--bg)}.bb.u{margin-inline-start:auto;background:var(--ac);color:#fff}.chip{border-radius:14px;font-size:12px;padding:3px 10px}#hlp details{margin:4px 0}.cpi{padding:7px 10px;border-radius:8px;cursor:pointer}.cpi.on,.cpi:hover{background:var(--bg)}
@media print{#hlp,#lnm,#cgx{display:none!important}.ph{display:none}}
[data-dv=mob] #hlp{width:100vw}[data-dv=mob] #usr .un{display:block;font-size:12px}[data-dv=mob] header{row-gap:4px}[data-dv=mob] .ph{flex-direction:column;gap:6px}[data-dv=mob] .ph button{align-self:flex-start}
</style>

<header><button id="mnu" class="np" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button><h1>FenOps <span class="t" style="font-weight:400">Installation</span> <span class="t" id="pcode"></span></h1>
<select id="role" aria-label="Role" onchange="setRole(this.value)"><option>Management</option><option>Project manager</option><option>Planning engineer</option><option>Site engineer</option><option>Site team leader</option><option>Site logistics</option><option>QA/QC</option><option>HSE</option><option>Engineering manager</option><option>Engineering team leader</option><option>Designer</option><option>Procurement manager</option><option>Procurement officer</option><option>Main contractor</option><option>Production manager</option><option>Production engineer</option><option>Production foreman</option><option>Production team leader</option><option>Maintenance in-charge</option></select><button id="bell" class="np" aria-label="Notifications" onclick="view='notes';NT.seen=NT.id;ntSave();R()" style="border:0;background:none;font-size:18px;cursor:pointer">🔔<b id="bn" style="background:var(--am);color:#000;border-radius:9px;padding:0 6px;font-size:12px"></b></button><select id="prj" aria-label="Project" onchange="switchProj(this.value)"></select><button id="npb" class="np" onclick="newProj()" title="New project" style="border:0;background:none;font-size:18px;cursor:pointer">+</button><select id="lang" aria-label="Language" onchange="setLang(this.value)"><option value="en">English<option value="ar">العربية<option value="hi">हिन्दी<option value="ur">اردو<option value="tl">Filipino<option value="bn">বাংলা<option value="ta">தமிழ்<option value="zh">中文</select><span id="off" class="m"></span><span id="usr" class="m"></span><button id="hbtn" class="np" onclick="helpOpen()" title="Help and guide (Ctrl+K to search)" style="margin-inline-start:auto;background:var(--ac);color:#fff;border-color:var(--ac)">? Help</button><button id="vmb" class="np" onclick="vmCycle()" title="Screen layout: Auto, PC, iPad, Phone"></button><div id="mods" class="np" role="tablist" aria-label="Modules"><button class="on" role="tab" aria-selected="true">Installation</button><button role="tab" disabled aria-disabled="true" title="Coming soon">Logistics</button><button role="tab" disabled aria-disabled="true" title="Coming soon">Production</button><button role="tab" disabled aria-disabled="true" title="Coming soon">Materials</button><button role="tab" id="modEng" onclick="view='eng';R()">Engineering</button></div></header>
<div id="wrap"><nav id="nav"></nav><main id="v"></main></div><div id="foot" class="np" role="tablist" aria-label="Common tabs"></div>
<div id="login" class="np" style="display:none;position:fixed;inset:0;z-index:60;background:var(--bg);align-items:center;justify-content:center;padding:16px"><div class="c" id="loginbox" style="max-width:340px;width:100%"></div></div>
<div id="prt"></div>
<div id="bqm" class="np" style="display:none;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px"></div>
<div id="lbx" class="np" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);align-items:center;justify-content:center"><img id="lbi" alt="photo" style="max-width:96vw;max-height:92vh"></div>
<div id="perm" class="np" style="display:none;position:fixed;left:12px;right:12px;bottom:84px;z-index:40;justify-content:center;pointer-events:none"><div class="c" style="max-width:520px;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,.25)"><span id="permm" style="flex:1 1 220px;font-size:13px"></span><span class="f" style="margin:0"><button id="permb" class="p" onclick="permAsk()">Enable notifications</button><button onclick="permSnooze(0)">Not now</button><button onclick="permSnooze(1)">Don't ask again</button></span></div></div>
<div id="scan" class="np" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px"><video id="scv" playsinline muted style="max-width:92vw;max-height:50vh;border-radius:8px"></video><div id="scm" style="color:#fff;min-height:1.4em;text-align:center"></div><div class="f"><input id="sci" placeholder="Employee ID" onkeydown="if(event.key=='Enter'){hit(this.value);this.value=''}"><button class="p" onclick="closeScan()">Done</button></div></div>
