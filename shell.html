<!doctype html>

<html lang="en"><head><meta charset="utf-8"><title>FenOps</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b7a75"><link rel="icon" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<style>
:root{--bg:#eef3f5;--pn:#fff;--ink:#1f2933;--mu:#5b6770;--ln:#d5dde2;--ac:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1519;--pn:#162027;--ink:#e8eff3;--mu:#9fb0ba;--ln:#263641;--ac:#2bb3a6}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif;padding:16px}
.b{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:26px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(15,40,50,.12)}
h1{font-size:22px;margin:0 0 4px}.m{color:var(--mu);font-size:13.5px;margin:0 0 14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink)}
button{margin-top:16px;width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}button:disabled{opacity:.6}
.e{color:#b42318;font-size:14px;margin-top:10px;min-height:20px}.l{margin-top:14px;font-size:13.5px;color:var(--mu);text-align:center}a{color:var(--ac)}
.c{margin-top:18px;font-size:11.5px;color:var(--mu);text-align:center;line-height:1.4}img.lg{max-height:46px;margin-bottom:10px;display:none}
</style></head><body>
<div class="b" id="b"><img class="lg" id="lg" alt=""><h1 id="t">FenOps</h1><p class="m" id="m">Sign in to continue.</p>
<form id="f" style="display:none"><label for="u">User name</label><input id="u" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button id="s" type="submit">Log in</button><div class="e" id="e" role="alert"></div>
<div class="l">New here? <a href="/welcome#signup">Request an account</a> &middot; <a href="/welcome">About FenOps</a></div></form>
<div id="ld" class="m">Loading...</div>
<div class="c" id="cr"></div></div>
<script>
(function(){
var T="";try{T=sessionStorage.getItem("fx-tok")||""}catch(x){}
function $(i){return document.getElementById(i)}
fetch("/api/public").then(function(r){return r.ok?r.json():null}).then(function(j){if(!j)return;if(j.name)$("t").textContent=j.name;if(j.logo){$("lg").src=j.logo;$("lg").style.display="block"}$("cr").innerHTML="&copy; "+new Date().getFullYear()+" "+(j.copyright||"FenOps").replace(/[<>&]/g,"")+". All rights reserved. Proprietary and confidential."}).catch(function(){});
async function load(){
  try{var r=await fetch("/api/app",{headers:{"X-Token":T},cache:"no-store"});
    if(r.ok){var h=await r.text();document.open();document.write(h);document.close();return}
    if(r.status==401){try{sessionStorage.removeItem("fx-tok")}catch(x){}T=""}
  }catch(x){$("ld").textContent="The server could not be reached. Reload to try again.";return}
  $("ld").style.display="none";$("f").style.display="block";$("u").focus()}
async function go(ev){ev.preventDefault();var b=$("s");b.disabled=true;$("e").textContent="";
  try{var r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({u:$("u").value.trim(),p:$("p").value})}),j=await r.json();
    if(!r.ok){$("e").textContent=j.error||"Login failed";b.disabled=false;return false}
    T=j.token;try{sessionStorage.setItem("fx-tok",T)}catch(x){}$("f").style.display="none";$("ld").style.display="block";load()}
  catch(x){$("e").textContent="Cannot reach the server";b.disabled=false}return false}
$("f").addEventListener("submit",go);load();
})();
</script></body></html>
