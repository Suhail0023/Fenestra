# Deploys Fenestra Site to Fly.io on every push to main (and on demand from the Actions tab).
# One-time setup in GitHub: Settings > Secrets and variables > Actions
#   Secret   FLY_API_TOKEN  = output of:  fly tokens create deploy --app <your-app-name>
#   Variable FLY_APP        = your Fly app name (only if it is not the name in fly.toml)
# Passwords and email/WhatsApp keys stay in Fly secrets (deploy.ps1 / fly secrets set); they are never in this repo.
name: Deploy to Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Fly token is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the repository secret FLY_API_TOKEN (Settings > Secrets and variables > Actions). Create it with: fly tokens create deploy --app <your-app-name>"
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
        run: flyctl deploy --remote-only --ha=false ${FLY_APP:+--app "$FLY_APP"}
